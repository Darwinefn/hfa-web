      if(!response.ok)return null;

      if(!data||!data.ok)return null;
      return {checked:!!data.checked,vpn:!!data.vpn,proxy:!!data.proxy,datacenter:!!data.datacenter,ipChanged:!!data.ipChanged,shared:Number(data.shared)||0,isp:String(data.isp||'').slice(0,60)};
    }catch(error){return null}
